<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Exercise Library</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#00f0ff",
            surface: "#0a0a0a",
            "surface-container": "#141414",
            "surface-container-high": "#1e1e1e",
            "on-background": "#f0f0f0",
            "on-surface-variant": "#a0a0a0",
            outline: "#333333",
            "outline-variant": "#00f0ff20",
            error: "#ff2d55"
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["JetBrains Mono", "monospace"]
          },
          borderRadius: {
            DEFAULT: "0px",
            lg: "0px",
            xl: "0px",
            full: "9999px"
          }
        }
      }
    };
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'WHT' 100, 'opsz' 24;
      vertical-align: middle;
    }
    .cyber-accent-glow {
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }
    .cyber-card-border {
      border: 1px solid rgba(0, 240, 255, 0.1);
    }
    .cyber-card-border:hover {
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    }
    body {
      min-height: max(884px, 100dvh);
      background-color: #0a0a0a;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-surface font-body text-on-background pb-32 md:pb-16 selection:bg-primary selection:text-surface">

  <!-- HEADER -->
  <header class="fixed top-0 w-full z-[110] bg-neutral-950/80 backdrop-blur-xl border-b border-cyan-500/20">
    <div class="flex justify-between items-center w-full px-6 h-16 max-w-screen-2xl mx-auto">
      <div class="flex items-center gap-4">
        <button class="text-cyan-400 hover:bg-neutral-800/50 transition-all duration-300 p-2 rounded-full active:scale-90">
          <span class="material-symbols-outlined">terminal</span>
        </button>
        <h1 class="text-lg font-bold tracking-[0.2em] text-cyan-400 font-['Space_Grotesk'] uppercase">
          EXER_PLANNER v1.0
        </h1>
      </div>

      <!-- DESKTOP MENU -->
      <div class="flex items-center gap-6">
        <div class="hidden md:flex gap-8 items-center">
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="index.html">DASH</a>
          <a class="text-cyan-400 font-bold font-['Space_Grotesk'] tracking-widest text-xs" href="exercise-library.html">LIBRARY</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="workout-history.html">HISTORY</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="workout-builder.html">BUILD</a>
        </div>

        <div class="w-8 h-8 rounded-full overflow-hidden border border-cyan-500/50 bg-neutral-800"></div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-screen-2xl mx-auto px-6 pt-24 pb-32 md:pb-16">

    <section class="mb-12 border-l-2 border-primary pl-6">
      <h2 class="text-[3rem] md:text-[4.5rem] font-bold font-headline leading-[0.9] text-on-background tracking-tighter mb-4 uppercase">
        EXERCISE<br /><span class="text-primary cyber-accent-glow">LIBRARY</span>
      </h2>
      <p class="text-on-surface-variant max-w-xl text-sm tracking-widest uppercase opacity-70">
        // MODULE: PERFORMANCE_MOVEMENTS<br />
        // STATUS: DEPLOYED
      </p>
    </section>

    <section class="mb-16 flex flex-col md:flex-row gap-6 items-stretch">
      <div class="relative flex-grow">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">search</span>
        <input id="library-search" class="w-full bg-surface-container border border-outline focus:border-primary py-5 pl-14 pr-6 text-xl font-label uppercase" placeholder="SEARCH_DATABASE..." type="text" />
      </div>

      <button id="create-new-exercise-button" class="bg-primary text-surface px-8 py-5 flex items-center justify-center gap-3 font-label font-bold uppercase tracking-[0.2em] hover:bg-cyan-300 active:scale-95 transition-all shadow-[0_0_20px_rgba(0,240,255,0.2)]">
        <span class="material-symbols-outlined">add</span>
        CREATE_NEW
      </button>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-1">
      <!-- cards unchanged -->
    </div>

  </main>

  <!-- MOBILE NAV -->
  <nav class="fixed bottom-0 left-0 w-full z-[110] flex justify-around items-center h-20 px-4 bg-neutral-900/90 backdrop-blur-2xl border-t border-white/5 md:hidden shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2" href="index.html">
      <span class="material-symbols-outlined">grid_view</span>
      <span class="text-[10px] font-medium tracking-widest uppercase mt-1">DASHBOARD</span>
    </a>

    <a class="flex flex-col items-center justify-center text-cyan-400 shadow-[inset_0_-2px_0_0_#00F0FF] bg-cyan-500/5 px-4 py-2" href="exercise-library.html">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">database</span>
      <span class="text-[10px] font-medium tracking-widest uppercase mt-1">LIBRARY</span>
    </a>

    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2" href="workout-history.html">
      <span class="material-symbols-outlined">history</span>
      <span class="text-[10px] font-medium tracking-widest uppercase mt-1">HISTORY</span>
    </a>

    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2" href="workout-builder.html">
      <span class="material-symbols-outlined">add_box</span>
      <span class="text-[10px] font-medium tracking-widest uppercase mt-1">BUILD</span>
    </a>
  </nav>

  <script src="js/store.js"></script>
  <script src="js/library.js"></script>

</body>
</html>
