<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Active Workout</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "var(--primary)",
            background: "var(--bg-primary)",
            surface: "var(--bg-surface)",
            "surface-variant": "var(--bg-surface-variant)",
            "on-background": "var(--text-primary)",
            "on-surface": "var(--text-primary)",
            "on-surface-variant": "var(--text-secondary)",
            outline: "var(--border-primary)",
            neutral: {
              "500": "var(--text-neutral-500)",
              "700": "var(--text-neutral-700)",
              "800": "var(--bg-neutral-800)",
              "900": "var(--bg-neutral-900)",
              "950": "var(--bg-neutral-950)"
            }
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            body: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .cyber-border {
      border: 1px solid var(--border-primary);
      position: relative;
    }
    .cyber-border::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 10px;
      height: 10px;
      border-top: 2px solid var(--primary);
      border-left: 2px solid var(--primary);
    }
    .cyber-gradient {
      background: linear-gradient(135deg, var(--primary) 0%, #0088ff 100%);
    }
    .glow-text {
      text-shadow: 0 0 10px var(--primary-glow);
    }
    body {
      min-height: max(884px, 100dvh);
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary/30 selection:text-primary">
  <header class="fixed top-0 w-full z-[110] bg-neutral-950/80 backdrop-blur-xl border-b border-cyan-500/20">
    <div class="flex justify-between items-center w-full px-6 h-16 max-w-screen-2xl mx-auto">
      <div class="flex items-center gap-4">
        <button class="text-cyan-400 hover:bg-neutral-800/50 transition-all duration-300 p-2 rounded-full active:scale-90" type="button">
          <span class="material-symbols-outlined" data-icon="terminal">terminal</span>
        </button>
        <h1 class="text-lg font-bold tracking-[0.2em] text-cyan-400 font-['Space_Grotesk'] uppercase">EXER_PLANNER v1.0</h1>
      </div>
      <div class="flex items-center gap-6">
        <div class="hidden md:flex gap-8 items-center">
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="index.html">DASH</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="exercise-library.html">LIBRARY</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="workout-history.html">HISTORY</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="workout-builder.html">BUILD</a>
        </div>
        <button class="theme-toggle-btn" data-theme-toggle type="button" aria-label="Toggle theme">
          <span class="material-symbols-outlined" data-theme-toggle-icon style="font-size: 20px;">light_mode</span>
        </button>
        <div class="w-8 h-8 rounded-full overflow-hidden border border-cyan-500/50 bg-neutral-800"></div>
      </div>
    </div>
  </header>

  <main class="max-w-screen-xl mx-auto px-6 py-24 pb-32 md:py-32 md:pb-16 flex flex-col items-center">
    <div class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
      <div class="lg:col-span-7 space-y-10">
        <div class="space-y-3">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-primary animate-pulse"></span>
            <span class="text-primary font-mono font-bold uppercase tracking-[0.2em] text-[10px]">CURRENT_SESSION_MOV</span>
          </div>
          <h2 id="exercise-name" class="text-5xl md:text-7xl font-headline font-bold tracking-tighter text-on-background leading-none uppercase glow-text">Exercise Name</h2>
        </div>

        <div class="exercise-image-frame relative group aspect-square bg-surface-variant cyber-border overflow-hidden">
          <img id="exercise-image" alt="Exercise Demonstration" class="exercise-image-fit p-6 opacity-80 transition-all duration-700 group-hover:scale-105 group-hover:opacity-100 grayscale hover:grayscale-0" src="" />
          <div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent opacity-60"></div>

          <div class="absolute bottom-8 left-8 flex items-center gap-8 text-white">
            <div class="flex flex-col">
              <span id="sets-remaining" class="font-headline font-bold text-5xl leading-none text-primary glow-text">04</span>
              <span class="font-mono text-[9px] uppercase tracking-widest font-medium opacity-60">SETS_REM</span>
            </div>
            <div class="h-12 w-[1px] bg-primary/20"></div>
            <div class="flex flex-col">
              <span id="target-reps" class="font-headline font-bold text-5xl leading-none text-primary glow-text">12</span>
              <span class="font-mono text-[9px] uppercase tracking-widest font-medium opacity-60">TRGT_REPS</span>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-5 flex flex-col justify-center h-full space-y-12">
        <div class="flex flex-col items-center lg:items-end space-y-6">
          <div class="w-full max-w-[22rem] bg-surface border border-white/10 p-6 cyber-border">
            <div class="flex items-center justify-between gap-4 mb-6">
              <div>
                <p class="font-mono text-[10px] uppercase tracking-[0.3em] text-primary">REST CLOCK</p>
              </div>
              <div class="text-right">
                <p class="font-mono text-[10px] uppercase tracking-[0.3em] text-white/40">Preset</p>
                <p id="rest-preset-display" class="font-headline text-2xl font-bold text-on-background">01:00</p>
              </div>
            </div>

            <div class="w-72 h-72 md:w-80 md:h-80 mx-auto bg-surface-variant flex items-center justify-center relative cyber-border">
              <div id="timer-display" class="text-[4.5rem] md:text-[5.5rem] font-headline font-bold tracking-tighter text-primary leading-none glow-text">01:00</div>
              <svg class="absolute inset-0 w-full h-full -rotate-90 p-4">
              <circle class="text-white/5" cx="50%" cy="50%" fill="transparent" r="48%" stroke="currentColor" stroke-width="1"></circle>
                <circle id="timer-progress-ring" class="text-primary/40" cx="50%" cy="50%" fill="transparent" r="48%" stroke="currentColor" stroke-dasharray="1000" stroke-dashoffset="0" stroke-width="2"></circle>
              </svg>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-6">
              <button id="decrease-timer-button" class="h-14 border border-white/10 flex items-center justify-center gap-2 text-on-surface-variant hover:border-primary/50 hover:text-primary transition-all active:scale-[0.98] duration-300">
                <span class="material-symbols-outlined">remove</span>
                <span class="font-mono text-[11px] uppercase tracking-[0.2em]">15 Sec</span>
              </button>
              <button id="increase-timer-button" class="h-14 border border-white/10 flex items-center justify-center gap-2 text-on-surface-variant hover:border-primary/50 hover:text-primary transition-all active:scale-[0.98] duration-300">
                <span class="material-symbols-outlined">add</span>
                <span class="font-mono text-[11px] uppercase tracking-[0.2em]">15 Sec</span>
              </button>
            </div>

            <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-4 pt-6">
              <button id="restart-timer-button" class="h-16 border border-white/10 flex items-center justify-center gap-2 text-on-surface-variant hover:border-primary/50 hover:text-primary transition-all active:scale-90 duration-300">
                <span class="material-symbols-outlined">replay</span>
                <span class="font-mono text-[10px] uppercase tracking-[0.2em]">Reset</span>
              </button>

              <button id="play-pause-button" class="cyber-gradient w-20 h-20 flex items-center justify-center text-background shadow-[0_0_20px_rgba(0,240,255,0.4)] active:scale-95 transition-transform justify-self-center">
                <span id="play-pause-icon" class="material-symbols-outlined !text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
              </button>

              <button id="skip-exercise-button" class="h-16 border border-white/10 flex items-center justify-center gap-2 text-on-surface-variant hover:border-primary/50 hover:text-primary transition-all active:scale-90 duration-300">
                <span class="material-symbols-outlined">skip_next</span>
                <span class="font-mono text-[10px] uppercase tracking-[0.2em]">Skip</span>
              </button>
            </div>
          </div>
        </div>

        <div>
          <p id="exercise-description" class="text-sm leading-relaxed text-on-surface-variant border-l-4 border-primary pl-6">
            Exercise description goes here.
          </p>
        </div>

        <button id="finish-set-button" class="bg-surface-variant border-l-4 border-primary p-8 flex items-center justify-between group cursor-pointer overflow-hidden relative w-full text-left">
          <div class="flex items-center gap-6 z-10">
            <div class="w-12 h-12 cyber-gradient flex items-center justify-center text-background">
              <span class="material-symbols-outlined">chevron_right</span>
            </div>
            <div>
              <p class="font-headline font-bold text-on-background tracking-wide uppercase">COMPLETE_SET</p>
              <p class="font-mono text-[9px] uppercase tracking-[0.2em] text-on-surface-variant">PRESS_TO_CONFIRM</p>
            </div>
          </div>
          <div class="absolute inset-0 bg-primary/10 translate-x-full group-hover:translate-x-0 transition-transform duration-500 ease-in-out"></div>
          <span class="material-symbols-outlined text-white/5 text-6xl absolute -right-4 opacity-50">keyboard_double_arrow_left</span>
        </button>
      </div>
    </div>

    <section class="w-full mt-24 space-y-8">
      <div class="flex items-center justify-between border-b border-white/5 pb-4">
        <h3 class="font-mono text-[10px] font-bold uppercase tracking-[0.3em] text-primary">UP_NEXT_QUEUE</h3>
        <span class="font-mono text-[10px] text-white/20">NEXT EXERCISES</span>
      </div>

      <div id="up-next-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 w-full z-[110] flex justify-around items-center h-20 px-4 bg-neutral-900/90 backdrop-blur-2xl border-t border-white/5 md:hidden shadow-[0_-10px_30px_rgba(0,0,0,0.5)]" aria-label="Primary">
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2 transition-colors" href="index.html">
      <span class="material-symbols-outlined">grid_view</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">DASHBOARD</span>
    </a>
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2 transition-colors" href="exercise-library.html">
      <span class="material-symbols-outlined">database</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">LIBRARY</span>
    </a>
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2 transition-colors" href="workout-history.html">
      <span class="material-symbols-outlined">history</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">HISTORY</span>
    </a>
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2 transition-colors" href="workout-builder.html">
      <span class="material-symbols-outlined">add_box</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">BUILD</span>
    </a>
  </nav>

  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/workout.js"></script>
</body>
</html>
