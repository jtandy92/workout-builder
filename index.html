<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Kinetic Editorial - Workouts Dashboard</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00f0ff",
            "on-primary": "#000000",
            "surface": "#0a0a0a",
            "on-surface": "#f5f5f5",
            "surface-variant": "#1a1a1a",
            "on-surface-variant": "#a3a3a3",
            "outline": "#333333",
            "accent-blue": "#00f0ff",
            "accent-dark": "#001a1c",
            "error": "#ff2d55"
          },
          fontFamily: {
            "headline": ["Space Grotesk", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"],
            "label": ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'WHT' 100, 'opsz' 24;
      vertical-align: middle;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #f5f5f5;
      -webkit-font-smoothing: antialiased;
      min-height: max(884px, 100dvh);
    }
    .neo-scanline {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06),
                  rgba(0, 255, 0, 0.02),
                  rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
  </style>
</head>

<body class="bg-surface text-on-surface pb-32 md:pb-16 overflow-x-hidden">

  <!-- HEADER -->
  <header class="fixed top-0 w-full z-[110] bg-neutral-950/80 backdrop-blur-xl border-b border-cyan-500/20">
    <div class="flex justify-between items-center w-full px-6 h-16 max-w-screen-2xl mx-auto">
      <div class="flex items-center gap-4">
        <button class="text-cyan-400 hover:bg-neutral-800/50 transition-all duration-300 p-2 rounded-full active:scale-90" type="button">
          <span class="material-symbols-outlined" data-icon="terminal">terminal</span>
        </button>
        <h1 class="text-lg font-bold tracking-[0.2em] text-cyan-400 font-['Space_Grotesk'] uppercase">EXER_PLANNER v1.0</h1>
      </div>
      <div class="flex items-center gap-6">
        <div class="hidden md:flex gap-8 items-center">
          <a class="text-cyan-400 font-bold font-['Space_Grotesk'] tracking-widest text-xs" href="index.html">DASH</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="exercise-library.html">LIBRARY</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="workout-history.html">HISTORY</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="workout-builder.html">BUILD</a>
        </div>
        <div class="w-8 h-8 rounded-full overflow-hidden border border-cyan-500/50 bg-neutral-800"></div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-screen-xl mx-auto px-6 pt-24 pb-32 md:pb-16">
    <h2 class="text-4xl md:text-6xl font-bold mb-10">System.Workouts</h2>
    <div id="workouts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>  </main>

  <!-- MOBILE NAV (FIXED) -->
  <nav class="fixed bottom-0 left-0 w-full z-[9999] flex justify-around items-center h-20 px-4 bg-neutral-900/90 backdrop-blur-2xl border-t border-white/5 md:hidden shadow-[0_-10px_30px_rgba(0,0,0,0.5)]" aria-label="Primary">

    <a class="flex flex-col items-center justify-center text-cyan-400 shadow-[inset_0_-2px_0_0_#00F0FF] bg-cyan-500/5 px-4 py-2" href="index.html">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">grid_view</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">DASHBOARD</span>
    </a>
  
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 transition-colors px-4 py-2" href="exercise-library.html">
      <span class="material-symbols-outlined">database</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">LIBRARY</span>
    </a>
  
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 transition-colors px-4 py-2" href="workout-history.html">
      <span class="material-symbols-outlined">history</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">HISTORY</span>
    </a>
  
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 transition-colors px-4 py-2" href="workout-builder.html">
      <span class="material-symbols-outlined">add_box</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">BUILD</span>
    </a>
  
  </nav>

  <!-- FIXED: scanline moved behind everything -->
  <div class="neo-scanline fixed inset-0 z-0 opacity-10 pointer-events-none"></div>

  <script src="js/store.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
