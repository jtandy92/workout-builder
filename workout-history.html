<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Workout History</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#00f0ff",
            "on-primary": "#000000",
            surface: "#0a0a0a",
            "on-surface": "#f8f9fa",
            "surface-variant": "#1a1a1a",
            "on-surface-variant": "#a1a1a1",
            outline: "#333333",
            "outline-variant": "#222222",
            tertiary: "#ff00ff"
          },
          fontFamily: {
            headline: ["Space Grotesk"],
            body: ["Inter"],
            mono: ["JetBrains Mono"]
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #0a0a0a;
      min-height: max(884px, 100dvh);
    }
    .headline-font {
      font-family: 'Space Grotesk', sans-serif;
    }
    .mono-font {
      font-family: 'JetBrains Mono', monospace;
    }
    .cyber-glow-text {
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }
  </style>
</head>
<body class="bg-surface text-on-surface">
  <header class="fixed top-0 w-full z-[110] bg-neutral-950/80 backdrop-blur-xl border-b border-cyan-500/20">
    <div class="flex justify-between items-center w-full px-6 h-16 max-w-screen-2xl mx-auto">
      <div class="flex items-center gap-4">
        <button class="text-cyan-400 hover:bg-neutral-800/50 transition-all duration-300 p-2 rounded-full active:scale-90" type="button">
          <span class="material-symbols-outlined" data-icon="terminal">terminal</span>
        </button>
        <h1 class="text-lg font-bold tracking-[0.2em] text-cyan-400 font-['Space_Grotesk'] uppercase">EXER_PLANNER v1.0</h1>
      </div>
      <div class="flex items-center gap-6">
        <div class="hidden md:flex gap-8 items-center">
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="index.html">DASH</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="exercise-library.html">LIBRARY</a>
          <a class="text-cyan-400 font-bold font-['Space_Grotesk'] tracking-widest text-xs" href="workout-history.html">HISTORY</a>
          <a class="text-neutral-500 hover:text-cyan-200 transition-colors font-['Space_Grotesk'] tracking-widest text-xs" href="workout-builder.html">BUILD</a>
        </div>
        <div class="w-8 h-8 rounded-full overflow-hidden border border-cyan-500/50 bg-neutral-800"></div>
      </div>
    </div>
  </header>

  <main class="max-w-screen-xl mx-auto px-6 pt-24 pb-32 md:pb-16">
    <section class="mb-16">
      <h2 class="text-7xl md:text-8xl font-bold headline-font tracking-tighter text-on-surface mb-2 uppercase italic">History</h2>
      <div class="flex items-baseline gap-4">
        <p id="history-count" class="text-primary font-mono text-sm tracking-widest uppercase cyber-glow-text">0_SESSIONS_COMPLETED</p>
        <div class="h-[1px] flex-grow bg-cyan-500/20"></div>
      </div>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-10">
      <aside class="md:col-span-3 space-y-12">
        <div class="border-l-2 border-primary pl-4">
          <p class="text-[10px] font-bold uppercase tracking-[0.4em] text-on-surface-variant mb-2 mono-font">Focus_Month</p>
          <h3 class="headline-font text-5xl font-bold text-on-surface">NOW</h3>
          <p class="text-primary mono-font text-xs mt-2">SESSION_LOG_ACTIVE</p>
        </div>

        <div class="p-6 bg-neutral-900 border border-neutral-800 relative overflow-hidden group">
          <div class="absolute top-0 right-0 w-12 h-12 bg-primary/5 -mr-6 -mt-6 rotate-45 group-hover:bg-primary/10 transition-colors"></div>
          <span class="material-symbols-outlined text-cyan-400 mb-4">insights</span>
          <p class="text-on-surface-variant font-body text-sm leading-relaxed uppercase tracking-tight">
            Review your completed workouts and total duration.
          </p>
        </div>
      </aside>

      <div class="md:col-span-9">
        <div class="flex flex-col">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between py-3 px-4 border border-cyan-500/20 bg-cyan-500/5 text-[10px] font-bold uppercase tracking-[0.2em] text-cyan-400 mb-6 mono-font">
            <div class="min-w-0">[ Workout ]</div>
            <div class="flex flex-wrap items-center gap-x-6 gap-y-1 sm:justify-end shrink-0">
              <span class="w-[4.5rem] sm:text-right">Time</span>
              <span class="w-[6.5rem] sm:text-right">Date</span>
              <span class="flex items-center gap-3 sm:gap-4">
                <span class="w-12 sm:w-14 text-right">Dur</span>
                <span class="w-9 inline-block" aria-hidden="true"></span>
              </span>
            </div>
          </div>

          <div id="history-list" class="space-y-4"></div>

          <button class="mt-16 w-full py-6 border border-cyan-500/20 text-cyan-400 font-bold headline-font uppercase tracking-[0.4em] hover:bg-cyan-500/10 transition-all duration-300 text-xs mono-font">
            [ LOCAL_ARCHIVE ]
          </button>
        </div>
      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 w-full z-[110] flex justify-around items-center h-20 px-4 bg-neutral-900/90 backdrop-blur-2xl border-t border-white/5 md:hidden shadow-[0_-10px_30px_rgba(0,0,0,0.5)]" aria-label="Primary">
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2 transition-colors" href="index.html">
      <span class="material-symbols-outlined">grid_view</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">DASHBOARD</span>
    </a>
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2 transition-colors" href="exercise-library.html">
      <span class="material-symbols-outlined">database</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">LIBRARY</span>
    </a>
    <a class="flex flex-col items-center justify-center text-cyan-400 shadow-[inset_0_-2px_0_0_#00F0FF] bg-cyan-500/5 px-4 py-2" href="workout-history.html">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">HISTORY</span>
    </a>
    <a class="flex flex-col items-center justify-center text-neutral-500 hover:text-cyan-200 px-4 py-2 transition-colors" href="workout-builder.html">
      <span class="material-symbols-outlined">add_box</span>
      <span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase mt-1">BUILD</span>
    </a>
  </nav>

  <script src="js/store.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
